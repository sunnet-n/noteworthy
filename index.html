<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tumbling Square</title>
<style>
body{
    margin:0;
    background:#f5f5f5;
}
canvas{
    display:block;
    margin:auto;
    background:white;
}
</style>
</head>
<body>

<canvas id="c" width="1600" height="700"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const x = 80;          // side length
const turns = 9;
const duration = 800;  // ms per tumble
const pause = 300;     // ms at landing

const groundY = 500;
const startX = 150;    // left edge of initial square

// Draw ground with ticks and individual section labels
function drawGround(){
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(50, groundY);
    ctx.lineTo(1500, groundY);
    ctx.stroke();

    // Draw the starting tick at 0x (Point D)
    ctx.beginPath();
    ctx.moveTo(startX, groundY-8);
    ctx.lineTo(startX, groundY+8);
    ctx.stroke();

    for(let k=1; k<=10; k++){
        let px = startX + k*x;

        // Draw boundary tick marks
        ctx.beginPath();
        ctx.moveTo(px, groundY-8);
        ctx.lineTo(px, groundY+8);
        ctx.stroke();

        // Label each center space between ticks as "x"
        ctx.font = "italic 18px Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "black";
        
        let midX = px - (x / 2);
        ctx.fillText("x", midX, groundY + 30);
    }
}

// Draw measurement lines (9x and 10x)
function drawDistanceLines(){
    // --- 9x Line (Traveled rotation distance: from initial Bottom-Right to final Bottom-Right) ---
    const start9x = startX + x;
    const end9x = startX + (10 * x);
    const y9x = groundY + 70;

    ctx.strokeStyle = "#20b2aa";             // Light sea green for 9x
    ctx.fillStyle = "#20b2aa";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(start9x, y9x);
    ctx.lineTo(end9x, y9x);
    ctx.stroke();

    // 9x Arrows
    ctx.beginPath();
    ctx.moveTo(start9x, y9x); ctx.lineTo(start9x + 10, y9x - 4); ctx.lineTo(start9x + 10, y9x + 4); ctx.fill();
    ctx.moveTo(end9x, y9x);   ctx.lineTo(end9x - 10, y9x - 4);   ctx.lineTo(end9x - 10, y9x + 4);   ctx.fill();

    ctx.font = "bold 16px Arial";
    ctx.fillText("9x (kat edilen mesafe)", (start9x + end9x) / 2, y9x - 10);


    // --- 10x Line (Total Span: Point D to Point H) ---
    const start10x = startX;
    const end10x = startX + (10 * x);
    const y10x = groundY + 140;

    ctx.strokeStyle = "#d9534f";             // Crimson red for 10x
    ctx.fillStyle = "#d9534f";

    ctx.beginPath();
    ctx.moveTo(start10x, y10x);
    ctx.lineTo(end10x, y10x);
    ctx.stroke();

    // 10x Arrows & Boundary Lines
    ctx.beginPath();
    ctx.moveTo(start10x, y10x - 5); ctx.lineTo(start10x, y10x + 5);
    ctx.moveTo(start10x, y10x); ctx.lineTo(start10x + 10, y10x - 4); ctx.lineTo(start10x + 10, y10x + 4); ctx.fill();
    
    ctx.moveTo(end10x, y10x - 5);   ctx.lineTo(end10x, y10x + 5);
    ctx.moveTo(end10x, y10x);   ctx.lineTo(end10x - 10, y10x - 4);   ctx.lineTo(end10x - 10, y10x + 4);   ctx.fill();
    ctx.stroke();

    // Labels D, H, and 10x
    ctx.font = "italic bold 18px Arial";
    ctx.fillText("D", start10x, y10x + 25);
    ctx.fillText("H", end10x, y10x + 25);
    
    ctx.font = "bold 18px Arial";
    ctx.fillText("10x (ilk ve son durum arasındaki mesafe)", (start10x + end10x) / 2, y10x - 10);
}

// Draw square with optional corner labels and custom label color
function drawSquare(points, color, showLabels = false, labelColor = "black"){
    ctx.fillStyle = color;
    ctx.strokeStyle = color.replace(/[\d.]+\)$/, "1)"); 
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i=1; i<4; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if (showLabels) {
        ctx.font = "bold 16px Arial";
        ctx.fillStyle = labelColor;
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        
        const labels = ["A", "B", "C", "D"];
        points.forEach((pt, idx) => {
            const offsetX = (pt.x - (points[0].x + points[2].x)/2) * 0.25;
            const offsetY = (pt.y - (points[0].y + points[2].y)/2) * 0.25;
            ctx.fillText(labels[idx], pt.x + offsetX, pt.y + offsetY);
        });
    }
}

// Rotate point about pivot
function rotate(p, pivot, theta){
    const dx = p.x - pivot.x;
    const dy = p.y - pivot.y;
    return {
        x: pivot.x + dx * Math.cos(theta) - dy * Math.sin(theta),
        y: pivot.y + dx * Math.sin(theta) + dy * Math.cos(theta)
    };
}

// Setup absolute initial vertices
const initial = [
    {x: startX,     y: groundY - x}, // A
    {x: startX + x, y: groundY - x}, // B
    {x: startX + x, y: groundY},     // C
    {x: startX,     y: groundY}      // D
];

let current = JSON.parse(JSON.stringify(initial));
let layoutIndices = [0, 1, 2, 3]; 

let step = 0;
let animStart = null;
let waiting = false;

function animate(time){
    if(step >= turns){
        render(current);
        return;
    }

    if(waiting){
        requestAnimationFrame(animate);
        return;
    }

    if(!animStart) animStart = time;

    let t = (time - animStart) / duration;
    if(t > 1) t = 1;

    const theta = t * Math.PI / 2;

    const pivotIndex = layoutIndices[2];
    const pivot = current[pivotIndex];

    const frameSquare = current.map(pt => rotate(pt, pivot, theta));

    render(frameSquare);

    if(t < 1){
        requestAnimationFrame(animate);
    } else {
        current = frameSquare;
        step++;
        animStart = null;
        waiting = true;

        const last = layoutIndices.pop();
        layoutIndices.unshift(last);

        setTimeout(() => {
            waiting = false;
            requestAnimationFrame(animate);
        }, pause);
    }
}

function render(movingSquare){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawGround();
    drawDistanceLines(); 
    
    // Initial ghost square
    drawSquare(initial, "rgba(0, 180, 0, 0.15)", true, "rgba(0, 120, 0, 0.7)");
    
    // Active square
    drawSquare(movingSquare, "rgba(30, 100, 255, 0.5)", true, "black");
}

render(current);
requestAnimationFrame(animate);
</script>

</body>
</html>
