<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:900px;
        padding:30px;
        border-radius:20px;
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(10px);
        box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    h1{
        font-size:clamp(1.8rem, 4vw, 2.5rem);
        margin-bottom:15px;
    }

    .target-date{
        font-size:clamp(1rem, 2.5vw, 1.2rem);
        opacity:0.9;
        margin-bottom:25px;
    }

    .countdown{
        display:flex;
        gap:15px;
        justify-content:center;
        flex-wrap:wrap;
        margin-bottom:25px;
    }

    .box{
        flex:1 1 120px;
        min-width:110px;
        max-width:150px;
        padding:20px 10px;
        border-radius:15px;
        background:rgba(255,255,255,0.15);
    }

    .number{
        font-size:clamp(1.8rem, 5vw, 3rem);
        font-weight:bold;
    }

    .label{
        margin-top:8px;
        font-size:0.9rem;
        text-transform:uppercase;
        letter-spacing:1px;
    }

    .address{
        margin-top:10px;
        font-size:clamp(0.95rem, 2.2vw, 1.1rem);
        line-height:1.6;
        opacity:0.95;
        padding-top:15px;
        border-top:1px solid rgba(255,255,255,0.2);
    }

    #expired{
        font-size:clamp(1.3rem, 4vw, 2rem);
        font-weight:bold;
        display:none;
        margin-top:20px;
    }

    /* 📱 Small screens optimization */
    @media (max-width: 500px){
        .container{
            padding:20px;
        }

        .countdown{
            gap:10px;
        }

        .box{
            flex:1 1 45%;
            min-width:120px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Seminer Tarihi ve Saati</h1>

    <div class="target-date">
        17 Haziran 2026, 13:00 (GMT+3)
    </div>

    <div class="countdown" id="countdown">
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Gün</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Saat</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Dk</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Sa</div>
        </div>
    </div>

    <div class="address">
        Derslik 2032, Blok E<br>
        Fen-Edebiyat Fakültesi<br>
        Yıldız Teknik Üniversitesi
    </div>

    <div id="expired">
        The countdown has ended!
    </div>
</div>

<script>
    const targetDate = new Date("2026-06-17T13:00:00+03:00");

    function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
            document.getElementById("countdown").style.display = "none";
            document.getElementById("expired").style.display = "block";
            return;
        }

        document.getElementById("days").textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("hours").textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById("minutes").textContent = Math.floor((diff / (1000 * 60)) % 60);
        document.getElementById("seconds").textContent = Math.floor((diff / 1000) % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
