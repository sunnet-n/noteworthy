<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:900px;
        padding:30px;
        border-radius:20px;
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(10px);
        box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    h1{
        font-size:clamp(1.8rem, 4vw, 2.5rem);
        margin-bottom:15px;
    }

    .target-date{
        font-size:clamp(1rem, 2.5vw, 1.2rem);
        opacity:0.9;
        margin-bottom:25px;
    }

    .countdown{
        display:flex;
        gap:15px;
        justify-content:center;
        flex-wrap:wrap;
        margin-bottom:25px;
    }
    
/* Zoom Meeting Information */

.meeting-info {
    margin-top: 30px;
    padding: 25px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    text-align: left;
    font-family: inherit;
}

.meeting-info h2 {
    font-size: 20px;
    font-weight: 600;
    color: #17365d;
    margin: 0 0 20px;
    text-align: center;
}

/* Meeting details */

.meeting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 13px 0;
    border-bottom: 1px solid #e2e8f0;
}

.meeting-row:last-of-type {
    border-bottom: none;
}

.meeting-label {
    font-size: 14px;
    font-weight: 600;
    color: #64748b;
}

.meeting-value {
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
    text-align: right;
    overflow-wrap: anywhere;
}

/* Join meeting button */

.meeting-button {
    display: block;
    margin-top: 22px;
    padding: 14px 20px;
    background: #17365d;
    color: #ffffff;
    border-radius: 9px;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s ease,
                transform 0.2s ease;
}

.meeting-button:hover {
    background: #24558c;
    color: #ffffff;
    transform: translateY(-2px);
}

/* Mobile responsiveness */

@media (max-width: 480px) {
    .meeting-info {
        padding: 18px;
    }

    .meeting-info h2 {
        font-size: 18px;
    }

    .meeting-row {
        align-items: flex-start;
    }

    .meeting-label,
    .meeting-value {
        font-size: 13px;
    }
}












    .box{
        flex:1 1 120px;
        min-width:110px;
        max-width:150px;
        padding:20px 10px;
        border-radius:15px;
        background:rgba(255,255,255,0.15);
    }

    .number{
        font-size:clamp(1.8rem, 5vw, 3rem);
        font-weight:bold;
    }

    .label{
        margin-top:8px;
        font-size:0.9rem;
        text-transform:uppercase;
        letter-spacing:1px;
    }

    .address{
        margin-top:10px;
        font-size:clamp(0.95rem, 2.2vw, 1.1rem);
        line-height:1.6;
        opacity:0.95;
        padding-top:15px;
        border-top:1px solid rgba(255,255,255,0.2);
    }

    #expired{
        font-size:clamp(1.3rem, 4vw, 2rem);
        font-weight:bold;
        display:none;
        margin-top:20px;
    }

    /* 📱 Small screens optimization */
    @media (max-width: 500px){
        .container{
            padding:20px;
        }

        .countdown{
            gap:10px;
        }

        .box{
            flex:1 1 45%;
            min-width:120px;
        }
    }
</style>
</head>

<body>


<div class="container">
    <h1>Seminer Tarihi ve Saati</h1>

    <div class="target-date">
        23 Eylül 2026, 14:00 (GMT+3)
    </div>

    <div class="countdown" id="countdown">
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Gün</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Saat</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Dk</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Sa</div>
        </div>
    </div>

    <!-- Zoom Meeting Information -->
    <div class="meeting-info">
        <h2>Seminer Katılım Bilgileri</h2>

        <div class="meeting-row">
            <span class="meeting-label">Platform</span>
            <span class="meeting-value">Online via Zoom</span>
        </div>

        <div class="meeting-row">
            <span class="meeting-label">Meeting ID</span>
            <span class="meeting-value">937 2685 8841</span>
        </div>

        <div class="meeting-row">
            <span class="meeting-label">Password</span>
            <span class="meeting-value">129 140</span>
        </div>

        <a
            href="https://online.yildiz.edu.tr/joinmeeting?meetingid=feeb9885-fbfb-402a-b349-294d144ba5e9"
            class="meeting-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Join Zoom Meeting &#8594;
        </a>
    </div>

    <div id="expired">
        The countdown has ended!
    </div>
</div>


<script>
    const targetDate = new Date("2026-10-14T15:00:00+03:00");

    function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
            document.getElementById("countdown").style.display = "none";
            document.getElementById("expired").style.display = "block";
            return;
        }

        document.getElementById("days").textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("hours").textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById("minutes").textContent = Math.floor((diff / (1000 * 60)) % 60);
        document.getElementById("seconds").textContent = Math.floor((diff / 1000) % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
